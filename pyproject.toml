[project]
name = "wristset"
version = "0.1.0"
description = "Wrist-IMU set analysis — form scoring, RIR/RPE estimation, and reported-vs-mechanical divergence from wrist smartwatch motion data."
readme = "README.md"
requires-python = ">=3.12"
# Core deps kept lean for a fast Phase 0 install. Heavy modelling deps
# (statsmodels, scikit-learn, numpyro, streamlit, dtaidistance) are added in the
# phase that first needs them — see the optional-dependencies groups below.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "polars>=1.0",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
# Phase 6-7 modelling
models = [
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "numpyro>=0.15",
    "jax>=0.4",
]
# Phase 2+ annotation / demo UI and DTW
ui = [
    "streamlit>=1.36",
    "plotly>=5.22",
]
dtw = [
    "dtaidistance>=2.3",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wristset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
